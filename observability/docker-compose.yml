services:
  loki:
    image: grafana/loki:3.6.0
    container_name: loki
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  grafana:
    # Upgrading from 10.4.2? DB migrations are one-way: back up the grafana-data
    # volume, step through 11.6.15 first, then move to 12.x (see README).
    image: grafana/grafana:12.4.4
    container_name: grafana
    expose:
      - "3000"
    environment:
      # Only applied on first init of a fresh DB; for an existing volume run:
      #   docker exec grafana grafana cli admin reset-admin-password "$GRAFANA_ADMIN_PASSWORD"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    labels:
      caddy: logs.fitznet.org
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy_network: fitznet
    networks:
      - default
      - fitznet
    restart: unless-stopped
    depends_on:
      - loki
      - prometheus

  promtail:
    image: grafana/promtail:3.6.0
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks:
      - default
      - fitznet
    restart: unless-stopped
    depends_on:
      - cadvisor
      - node-exporter

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: node-exporter
    ports:
      - "9100:9100"
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
  prometheus-data:

networks:
  fitznet:
    external: true
