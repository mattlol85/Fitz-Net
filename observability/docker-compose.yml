services:
  loki:
    image: grafana/loki:3.6.0
    container_name: loki
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    # Loki has auth_enabled: false and is only consumed by Grafana/Promtail over
    # the Docker network. Bind the published port to loopback so it is reachable
    # for local debugging on the host but not from the LAN or other containers'
    # host interface. Remove this block entirely if host access is never needed.
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  grafana:
    # Latest stable release (was 10.4.2). GET /api/health still discloses the
    # version string unauthenticated — Grafana has no option to disable that —
    # so keep this on a current patched release.
    image: grafana/grafana:13.2.3
    container_name: grafana
    expose:
      - "3000"
    environment:
      # Strong admin password from .env (see .env.example); no baked-in default.
      # Only applied when Grafana first creates its DB — on an existing volume,
      # rotate with `docker exec -it grafana grafana cli admin reset-admin-password`.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in observability/.env}
      # Grafana is internet-exposed at logs.fitznet.org — keep anonymous access
      # and self-service signup off so the login page is the only way in.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    labels:
      caddy: logs.fitznet.org
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy_network: fitznet
    networks:
      - default
      - fitznet
    restart: unless-stopped
    depends_on:
      - loki
      - prometheus

  promtail:
    image: grafana/promtail:3.6.0
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # --web.enable-lifecycle removed: it exposes an unauthenticated
      # POST /-/reload (and /-/quit). Re-add only if hot config reload is needed.
    # Prometheus UI has no authentication. Bind to loopback only so it is not
    # reachable from the LAN or a compromised container via the host interface.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks:
      - default
      - fitznet
    restart: unless-stopped
    depends_on:
      - cadvisor
      - node-exporter

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    # Exposes detailed per-container metrics and host info with no auth.
    # Prometheus scrapes it over the Docker network (see prometheus.yml);
    # bind the published port to loopback only.
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    # Runs with pid: host and /:/host:ro — host metrics, no auth.
    # Prometheus scrapes it over the Docker network; bind to loopback only.
    ports:
      - "127.0.0.1:9100:9100"
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
  prometheus-data:

networks:
  fitznet:
    external: true
