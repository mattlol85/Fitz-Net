global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: prometheus
          instance: prometheus

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          service: cadvisor
          instance: cadvisor

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: node-exporter
          instance: node-exporter

  # Spring Boot Actuator — both services are on the fitznet Docker network
  - job_name: fitz-net-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - fitz-net-api:8080
        labels:
          service: fitz-net-api
          instance: fitz-net-api

  - job_name: gamerbell
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gamerbell:8080
        labels:
          service: gamerbell
          instance: gamerbell
