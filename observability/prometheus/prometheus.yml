global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # Spring Boot Actuator — both services are on the fitznet Docker network
  - job_name: fitz-net-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['fitz-net-api:8080']

  - job_name: gamerbell
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['gamerbell:8080']

  # Marine Park relay (marinepark_relay_* rooms, peers, bytes, closes by code).
  # Metrics are on their own port, which Caddy never routes.
  - job_name: marine-park-relay
    metrics_path: /metrics
    static_configs:
      - targets: ['marine-park-relay:9464']
