# Prerequisites (run once on the host before first deploy):
#   1. Create the external network:  docker network create fitznet
#   2. Copy .env.example to .env and fill in secrets
#
# Deploy:
#   docker compose up -d
#
# Memory limits: every service sets mem_limit so a leak in one container is
# OOM-killed (and restarted) on its own instead of starving the whole VM.
# Sized at ~1.5-2x observed steady-state usage; see docs/resource-limits.md.

services:
  gamerbell:
    image: mattlol85/bell-api:latest
    container_name: gamerbell
    mem_limit: 768m
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Size the JVM heap from mem_limit (default is 25% of host RAM, which
      # ignores the container cap). 70% leaves headroom for metaspace/threads.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    networks:
      - fitznet
      - internal
    # 9090 is gRPC (see docs/grpc.md): Docker-network only, not routed through Caddy.
    expose:
      - "8080"
      - "9090"
    labels:
      # Legacy direct path (router 80/443 -> Caddy, Let's Encrypt cert). Bells on
      # firmware <= v0.16.0 only know this host; keep it until every bell has
      # moved to gamerbell.fitznet.org (docs/cloudflare-tunnel.md).
      caddy_0: gamerbell.fitznet.doomdns.org
      caddy_0.reverse_proxy: "{{upstreams 8080}}"
      # Cloudflare Tunnel path. Cloudflare terminates TLS and cloudflared sends
      # plain HTTP to caddy:80, so this site must be http:// (an https site
      # would redirect back to https and loop).
      caddy_1: http://gamerbell.fitznet.org
      caddy_1.reverse_proxy: "{{upstreams 8080}}"
      caddy_network: fitznet

  fitz-net-api:
    image: mattlol85/fitz-net-api:latest
    container_name: fitz-net-api
    mem_limit: 640m
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      JOENET_HOST: ${JOENET_HOST:-joenet.doomdns.org}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_PASSWORD: ${MONGO_APP_PASSWORD}
      # Size the JVM heap from mem_limit (default is 25% of host RAM, which
      # ignores the container cap). 70% leaves headroom for metaspace/threads.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    networks:
      - fitznet
      - internal
    # 9090 is gRPC (see docs/grpc.md): Docker-network only, not routed through Caddy.
    expose:
      - "8080"
      - "9090"
    labels:
      # Legacy direct path (router 80/443 -> Caddy, Let's Encrypt cert).
      caddy_0: api.fitznet.doomdns.org
      caddy_0.reverse_proxy: "{{upstreams 8080}}"
      # Cloudflare Tunnel path: plain HTTP from cloudflared (Cloudflare does TLS).
      caddy_1: http://api.fitznet.org
      caddy_1.reverse_proxy: "{{upstreams 8080}}"
      caddy_network: fitznet
    depends_on:
      - mongo

  fitz-net-website:
    image: mattlol85/fitz-net-website:latest
    container_name: fitz-net-website
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - fitznet
      - internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "80"
    labels:
      # HTTPS sites: doomdns direct path, plus fitznet.org for Cloudflare's proxied
      # path to origin:443 until its DNS points at the tunnel.
      caddy_0: fitznet.org, fitznet.doomdns.org
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      # Cloudflare Tunnel path: plain HTTP from cloudflared (Cloudflare does TLS).
      # An explicit http:// site stops Caddy's http->https redirect for this host.
      caddy_1: http://fitznet.org
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      caddy_network: fitznet
    depends_on:
      - fitz-net-api

  mongo:
    image: mongo:8.0
    container_name: fitz-net-api-mongo
    mem_limit: 768m
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init/create-app-user.sh:/docker-entrypoint-initdb.d/create-app-user.sh:ro
    networks:
      - internal

  caddy:
    image: lucaslorentz/caddy-docker-proxy:latest
    container_name: caddy
    mem_limit: 128m
    restart: unless-stopped
    labels:
      # Real client IPs (Caddy global options). Trust the fitznet Docker network
      # (cloudflared) except its gateway 172.18.0.1, which docker-proxy uses for
      # forwarded outside traffic, plus Cloudflare's edge ranges
      # (cloudflare.com/ips, fetched 2026-11-18) for proxied-to-origin requests.
      caddy.servers.trusted_proxies: "static 172.18.0.2/31 172.18.0.4/30 172.18.0.8/29 172.18.0.16/28 172.18.0.32/27 172.18.0.64/26 172.18.0.128/25 172.18.1.0/24 172.18.2.0/23 172.18.4.0/22 172.18.8.0/21 172.18.16.0/20 172.18.32.0/19 172.18.64.0/18 172.18.128.0/17 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32"
      caddy.servers.client_ip_headers: "Cf-Connecting-IP X-Forwarded-For"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/data
    networks:
      - fitznet

  # Outbound-only connector for the Cloudflare Tunnel: Cloudflare's edge sends
  # requests for the tunnel's public hostnames down this connection to
  # http://caddy:80, so those hostnames need no open router ports. Hostname
  # routing lives in the Cloudflare dashboard (remotely managed tunnel); see
  # docs/cloudflare-tunnel.md.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    container_name: cloudflared
    mem_limit: 64m
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      # Empty until the tunnel exists: cloudflared then exits and restarts on its
      # own without blocking the rest of the stack.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    networks:
      - fitznet

volumes:
  mongo_data:
  caddy_data:

networks:
  fitznet:
    external: true
  internal:
    driver: bridge
