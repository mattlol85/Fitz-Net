# Prerequisites (run once on the host before first deploy):
#   1. Create the external network:  docker network create fitznet
#   2. Copy .env.example to .env and fill in secrets
#
# Deploy:
#   docker compose up -d

services:
  gamerbell:
    image: mattlol85/bell-api:latest
    container_name: gamerbell
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DATABASE: ${MONGO_DATABASE}
    networks:
      - fitznet
      - internal
    expose:
      - "8080"
    labels:
      caddy: gamerbell.fitznet.doomdns.org
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy_network: fitznet
    depends_on:
      - mongo

  fitz-net-api:
    image: mattlol85/fitz-net-api:latest
    container_name: fitz-net-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DATABASE: ${MONGO_DATABASE}
    networks:
      - fitznet
      - internal
    expose:
      - "8080"
    labels:
      caddy: api.fitznet.doomdns.org, api.fitznet.org
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy_network: fitznet
    depends_on:
      - mongo

  fitz-net-website:
    image: mattlol85/fitz-net-website:latest
    container_name: fitz-net-website
    restart: unless-stopped
    networks:
      - fitznet
      - internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "80"
    labels:
      caddy: fitznet.org, fitznet.doomdns.org
      caddy.reverse_proxy: "{{upstreams 80}}"
      caddy_network: fitznet
    depends_on:
      - fitz-net-api

  mongo:
    # Bumped off EOL 4.4 (unsupported since Feb 2024) to the current 7.x series.
    image: mongo:7.0
    container_name: fitz-net-api-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
      # Root credentials enable authentication. Set these in .env (see
      # .env.example). The app services (fitz-net-api, gamerbell) must then
      # authenticate — wire MONGO_USERNAME / MONGO_PASSWORD into their Spring
      # config so the connection URI includes credentials and authSource=admin.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    # The API and GamerBell reach Mongo over the internal Docker network by
    # service name; the host does not need 27017 on all interfaces. Bind to
    # loopback only for local admin/debugging (removes LAN + container exposure).
    ports:
      - "127.0.0.1:27017:27017"

  caddy:
    image: lucaslorentz/caddy-docker-proxy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/data
    networks:
      - fitznet

volumes:
  mongo_data:
  caddy_data:

networks:
  fitznet:
    external: true
  internal:
    driver: bridge
